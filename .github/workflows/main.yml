
name: Orvex CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: git diff --check

      - name: Validate Unity structure
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json

  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: all
          artifactsPath: artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orvex-Test-Results
          path: artifacts
          if-no-files-found: ignore

  build:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildsPath: build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Orvex-Windows
          path: build
          if-no-files-found: error
          retention-days: 14
